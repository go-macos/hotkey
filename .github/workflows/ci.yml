name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A workflow that fails to PARSE reports nothing at all: no jobs run, no
  # checks appear, and the pull request looks unexercised rather than broken.
  # This is the only lane that would notice.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  gofmt:
    name: gofmt + tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # The real Carbon lane. A GitHub runner has a window server, so registration
  # genuinely works there — but claiming a system-wide combination on a shared
  # runner is rude and flaky, so the LIVE suite does not run here. What runs is
  # the portable layer plus proof that the darwin bindings and the integration
  # suite both compile against the real framework.
  darwin:
    name: darwin (CGO=0, real Carbon bindings)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: CGO_ENABLED=0 go vet ./...
      - run: CGO_ENABLED=0 go build ./...
      - name: The live suite must at least COMPILE
        run: CGO_ENABLED=0 go vet -tags integration ./...
      - name: Test
        run: CGO_ENABLED=0 go test -count=1 ./...
      - name: Coverage (the library package; the cmd is a tool, not the contract)
        run: CGO_ENABLED=0 go test -count=1 -coverprofile=cover.out .
      - name: Race (CGO=1)
        run: CGO_ENABLED=1 go test -race -count=1 ./...
      # The gate is on the PORTABLE files, not the total. The Carbon bindings
      # cannot be covered without claiming real system-wide keys on a shared
      # runner, and a total-coverage gate would either be a lie or force this
      # job to fight the runner for ⌥⌘F13.
      - name: 100% coverage gate on the portable layer
        shell: bash
        run: |
          # By SHAPE, not by name. Listing the portable files means a new one
          # is outside the gate until somebody remembers to add it, which is
          # the same thing as not having a gate. parse.go was added on
          # 2026-08-26 and would have escaped this list.
          go tool cover -func=cover.out \
            | grep -vE '_(darwin|linux|android|windows|js|other)\.go:' \
            | grep -v '/cmd/' \
            | grep -v '^total:' > portable.txt
          cat portable.txt
          if grep -v '100.0%' portable.txt; then
            echo "::error::the portable layer is below 100% (lines above)"; exit 1
          fi
          echo "portable layer: 100%"
      - name: Coverage summary (whole package, bindings included)
        run: go tool cover -func=cover.out | tail -1

  # Every non-darwin platform must COMPILE and answer ErrUnsupported rather
  # than failing to build: a consumer cross-compiles this without thinking
  # about it. All six of Go's 64-bit targets are covered.
  cross:
    name: cross ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: loong64 }
          - { goos: linux, goarch: ppc64le }
          - { goos: linux, goarch: s390x }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: freebsd, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go vet ./...

  # The policy layer is OS-independent by construction, so the ladder, the
  # formatting and the preference parsing are RUN, not merely compiled, on all
  # six 64-bit architectures. amd64 natively; the other five under qemu-user.
  # An endianness bug in the modifier-mask arithmetic would show up on s390x
  # and nowhere else.
  arches:
    name: run tests on ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: amd64, qemu: "", qemu_cpu: "" }
          - { goarch: arm64, qemu: qemu-aarch64-static, qemu_cpu: "" }
          - { goarch: riscv64, qemu: qemu-riscv64-static, qemu_cpu: "" }
          - { goarch: loong64, qemu: qemu-loongarch64-static, qemu_cpu: "" }
          - { goarch: ppc64le, qemu: qemu-ppc64le-static, qemu_cpu: power10 }
          - { goarch: s390x, qemu: qemu-s390x-static, qemu_cpu: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install qemu-user
        if: matrix.qemu != ''
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Build the test binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go test -c -o hotkey.test .
      # QEMU_CPU must be EXPORTED ONLY when it has a value: qemu-user refuses
      # to start with "-cpu option cannot be empty" if it is set to the empty
      # string, which is what `env: QEMU_CPU: ${{ matrix.qemu_cpu }}` does for
      # the arches that do not need one. Setting a variable empty is not the
      # same as not setting it.
      - name: Run it
        env:
          QEMU: ${{ matrix.qemu }}
          QEMU_CPU_WANTED: ${{ matrix.qemu_cpu }}
        run: |
          if [ -n "$QEMU_CPU_WANTED" ]; then
            export QEMU_CPU="$QEMU_CPU_WANTED"
          fi
          if [ -z "$QEMU" ]; then
            ./hotkey.test -test.count=1 -test.v
          else
            "$QEMU" ./hotkey.test -test.count=1 -test.v
          fi

  linux:
    name: linux (stubs + portable coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: CGO_ENABLED=0 go test -count=1 ./...
      - run: CGO_ENABLED=0 go test -count=1 -coverprofile=cover.out .
      # Off darwin there is no excuse for anything in the library to be
      # uncovered: all that exists here is portable policy plus the stubs.
      # Measured at 100.0% before this workflow was written.
      - name: 100% coverage gate on EVERYTHING that exists off darwin
        shell: bash
        run: |
          go tool cover -func=cover.out | tee full.txt
          if grep -v '100.0%' full.txt | grep -v '^total:'; then
            echo "::error::below 100% on linux (lines above)"; exit 1
          fi

  windows:
    name: windows (stubs)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test -count=1 ./...
        env:
          CGO_ENABLED: 0
